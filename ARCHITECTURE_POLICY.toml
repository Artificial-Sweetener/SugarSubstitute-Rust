schema = 1

[menus]
context_menu = "frontend/comfyui/ui/menus/ContextMenu.ts"
floating_surface = "frontend/comfyui/ui/menus/FloatingSurface.ts"
control_runtime = "frontend/comfyui/ui/menus/MenuControlRuntime.ts"
# The Add Cube search dialog presents selectable search results, not context actions.
search_dialogs = ["frontend/comfyui/ui/picker/ComfyCubeAddMenuPresenter.ts"]
choice_controls = ["frontend/comfyui/ui/output_canvas/presentation/vue/CanvasAnchoredPicker.ts"]

[invalidation]
document_observer_owners = [
  "frontend/comfyui/ui/core/HostSurfaceObserver.ts",
  "frontend/comfyui/ui/surface/ComfyRendererPresenceObserver.ts",
  "frontend/comfyui/ui/surface/appearance/OverlayScrollbarHost.ts",
]
mutation_observer_owners = [
  "frontend/comfyui/ui/surface/appearance/AccentThemeHost.ts",
  "frontend/comfyui/ui/core/HostSurfaceObserver.ts",
  "frontend/comfyui/ui/dialogs/ModalAppearance.ts",
  "frontend/comfyui/ui/picker/ComfyCubePickerResultPresenter.ts",
  "frontend/comfyui/ui/relations/infrastructure/NativeLinkChoiceLabels.ts",
  "frontend/comfyui/ui/relations/presentation/GlobalOverrideToolbar.ts",
  "frontend/comfyui/ui/surface/ComfyRendererPresenceObserver.ts",
  "frontend/comfyui/ui/surface/ComfyVueCubeColorScope.ts",
  "frontend/comfyui/ui/surface/ComfyVueCubeNodeHost.ts",
  "frontend/comfyui/ui/surface/ComfyVueNodeCardRenderer.ts",
  "frontend/comfyui/ui/surface/NativeChoiceRestrictions.ts",
  "frontend/comfyui/ui/surface/NodeCardIconHost.ts",
  "frontend/comfyui/ui/surface/appearance/AppearanceHost.ts",
  "frontend/comfyui/ui/surface/appearance/OverlayScrollbarHost.ts",
  "frontend/comfyui/ui/surface/appearance/NativeToggleRows.ts",
  "frontend/comfyui/ui/surface/appearance/NativeBooleanSegments.ts",
  "frontend/comfyui/ui/model_library/ModelPickerAppearance.ts",
]

[structure]
source_roots = [
  "__init__.py",
  "prestartup_script.py",
  "load_model_roots.py",
  "sugarcubes_model_roots",
  "sugarcubes",
  "frontend",
  "scripts",
  "tools",
  "stubs",
  "types",
]
extensions = [".py", ".pyi", ".ts", ".tsx"]
excluded_prefixes = [
  ".generated/",
  "artifacts/",
  "node_modules/",
  "web/",
]
soft_lines = 350
hard_lines = 500

[[dependency]]
name = "TYPESCRIPT_WORKFLOW_DOMAIN"
paths = ["frontend/comfyui/ui/workflow/domain/*.ts"]
forbidden_typescript_paths = [
  "frontend/comfyui/ui/workflow/application",
  "frontend/comfyui/ui/workflow/infrastructure",
  "frontend/comfyui/ui/surface",
  "frontend/comfyui/ui/cube",
  "frontend/comfyui/ui/picker",
]

[[dependency]]
name = "TYPESCRIPT_EXECUTION_DOMAIN"
paths = ["frontend/comfyui/ui/execution/domain/*.ts"]
forbidden_typescript_paths = [
  "frontend/comfyui/ui/execution/application",
  "frontend/comfyui/ui/execution/infrastructure",
  "frontend/comfyui/ui/output_canvas",
  "frontend/comfyui/ui/surface",
  "frontend/comfyui/ui/cube",
  "types/comfyui",
  "node_modules",
  "/scripts",
  "frontend/comfyui/ui/types/graph",
]

