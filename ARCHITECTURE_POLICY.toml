schema = 1

[invalidation]
document_observer_owners = [
  "frontend/comfyui/ui/core/HostSurfaceObserver.ts",
  "frontend/comfyui/ui/surface/ComfyRendererPresenceObserver.ts",
  "frontend/comfyui/ui/surface/appearance/FluentOverlayScrollbarHost.ts",
]
mutation_observer_owners = [
  "frontend/comfyui/ui/core/HostSurfaceObserver.ts",
  "frontend/comfyui/ui/dialogs/ModalAppearance.ts",
  "frontend/comfyui/ui/picker/ComfyCubePickerResultPresenter.ts",
  "frontend/comfyui/ui/relations/infrastructure/NativeLinkChoiceLabels.ts",
  "frontend/comfyui/ui/relations/presentation/GlobalOverrideToolbar.ts",
  "frontend/comfyui/ui/surface/ComfyRendererPresenceObserver.ts",
  "frontend/comfyui/ui/surface/ComfyVueCubeColorScope.ts",
  "frontend/comfyui/ui/surface/ComfyVueCubeNodeHost.ts",
  "frontend/comfyui/ui/surface/ComfyVueNodeCardRenderer.ts",
  "frontend/comfyui/ui/surface/NativeChoiceRestrictions.ts",
  "frontend/comfyui/ui/surface/NodeCardIconHost.ts",
  "frontend/comfyui/ui/surface/appearance/FluentAppearanceHost.ts",
  "frontend/comfyui/ui/surface/appearance/FluentOverlayScrollbarHost.ts",
  "frontend/comfyui/ui/surface/appearance/NativeToggleRows.ts",
  "frontend/comfyui/ui/model_library/ModelPickerAppearance.ts",
]

[structure]
source_roots = [
  "__init__.py",
  "prestartup_script.py",
  "load_model_roots.py",
  "sugarcubes_model_roots",
  "sugarcubes",
  "frontend",
  "scripts",
  "tools",
  "stubs",
  "types",
]
extensions = [".py", ".pyi", ".ts", ".tsx"]
excluded_prefixes = [
  ".generated/",
  "artifacts/",
  "node_modules/",
  "web/",
]
soft_lines = 350
hard_lines = 500

[[dependency]]
name = "TYPESCRIPT_SEARCH_DOMAIN"
paths = ["frontend/comfyui/ui/search/domain/*.ts"]
forbidden_typescript_paths = [
  "frontend/comfyui/ui/search/application",
  "frontend/comfyui/ui/search/infrastructure",
  "frontend/comfyui/ui/search/presentation",
  "frontend/comfyui/ui/surface",
  "frontend/comfyui/ui/cube",
]

[[dependency]]
name = "TYPESCRIPT_SEARCH_APPLICATION"
paths = ["frontend/comfyui/ui/search/application/*.ts"]
forbidden_typescript_paths = [
  "frontend/comfyui/ui/search/infrastructure",
  "frontend/comfyui/ui/search/presentation",
  "frontend/comfyui/ui/surface",
  "frontend/comfyui/ui/cube",
]

[[dependency]]
name = "TYPESCRIPT_RELATION_DOMAIN"
paths = ["frontend/comfyui/ui/relations/domain/*.ts"]
forbidden_typescript_paths = [
  "frontend/comfyui/ui/relations/application",
  "frontend/comfyui/ui/relations/infrastructure",
  "frontend/comfyui/ui/relations/presentation",
  "frontend/comfyui/ui/surface",
  "frontend/comfyui/ui/cube",
]

[[dependency]]
name = "TYPESCRIPT_RELATION_APPLICATION"
paths = ["frontend/comfyui/ui/relations/application/*.ts"]
forbidden_typescript_paths = [
  "frontend/comfyui/ui/relations/infrastructure",
  "frontend/comfyui/ui/relations/presentation",
  "frontend/comfyui/ui/surface",
  "frontend/comfyui/ui/cube",
]

[[dependency]]
name = "TYPESCRIPT_EDITOR_ACTION_DOMAIN"
paths = ["frontend/comfyui/ui/editor_actions/domain/*.ts"]
forbidden_typescript_paths = [
  "frontend/comfyui/ui/editor_actions/application",
  "frontend/comfyui/ui/editor_actions/infrastructure",
  "frontend/comfyui/ui/editor_actions/presentation",
  "frontend/comfyui/ui/menus",
  "frontend/comfyui/ui/dialogs",
  "frontend/comfyui/ui/surface",
  "frontend/comfyui/ui/model_library",
]

[[dependency]]
name = "TYPESCRIPT_EDITOR_ACTION_APPLICATION"
paths = ["frontend/comfyui/ui/editor_actions/application/*.ts"]
forbidden_typescript_paths = [
  "frontend/comfyui/ui/editor_actions/infrastructure",
  "frontend/comfyui/ui/editor_actions/presentation",
  "frontend/comfyui/ui/menus",
  "frontend/comfyui/ui/dialogs",
  "frontend/comfyui/ui/surface",
  "frontend/comfyui/ui/model_library",
]

[[dependency]]
name = "PYTHON_MODEL_ROOT_DOMAIN"
paths = ["sugarcubes_model_roots/domain.py", "sugarcubes_model_roots/service.py"]
forbidden_python_imports = [
  "sugarcubes_model_roots.store",
  "sugarcubes_model_roots.startup",
  "aiohttp",
  "pathlib",
]

[[dependency]]
name = "PYTHON_DOMAIN"
paths = ["sugarcubes/cube_model/**/*.py", "sugarcubes/cube_model/*.py"]
forbidden_python_imports = [
  "sugarcubes.backend",
  "sugarcubes.exporter",
  "sugarcubes.importer",
  "sugarcubes.runtime",
]

[[dependency]]
name = "PYTHON_MODEL_LIBRARY_DOMAIN"
paths = ["sugarcubes/model_library/domain/*.py"]
forbidden_python_imports = [
  "sugarcubes.model_library.application",
  "sugarcubes.model_library.infrastructure",
  "sugarcubes.backend",
  "aiohttp",
  "pathlib",
  "sqlite3",
]

[[dependency]]
name = "PYTHON_MODEL_LIBRARY_APPLICATION"
paths = ["sugarcubes/model_library/application/*.py"]
forbidden_python_imports = [
  "sugarcubes.model_library.infrastructure",
  "sugarcubes.backend",
  "aiohttp",
  "pathlib",
  "sqlite3",
]

[[dependency]]
name = "PYTHON_EXPORT"
paths = ["sugarcubes/exporter/**/*.py", "sugarcubes/exporter/*.py"]
forbidden_python_imports = [
  "sugarcubes.backend",
  "sugarcubes.importer",
  "sugarcubes.runtime",
]

[[dependency]]
name = "TYPESCRIPT_CORE"
paths = ["frontend/comfyui/ui/core/**/*.ts", "frontend/comfyui/ui/core/*.ts"]
forbidden_typescript_paths = [
  "frontend/comfyui/ui/browser",
  "frontend/comfyui/ui/dialogs",
  "frontend/comfyui/ui/overlays",
  "frontend/comfyui/ui/save",
  "frontend/comfyui/ui/settings",
  "frontend/comfyui/ui/surface",
]

[[dependency]]
name = "TYPESCRIPT_GRAPH"
paths = ["frontend/comfyui/ui/graph/**/*.ts", "frontend/comfyui/ui/graph/*.ts"]
forbidden_typescript_paths = [
  "frontend/comfyui/ui/browser",
  "frontend/comfyui/ui/dialogs",
  "frontend/comfyui/ui/overlays",
  "frontend/comfyui/ui/save",
  "frontend/comfyui/ui/settings",
]

[[dependency]]
name = "TYPESCRIPT_EXECUTION"
paths = [
  "frontend/comfyui/ui/cube/execution/**/*.ts",
  "frontend/comfyui/ui/cube/execution/*.ts",
]
forbidden_typescript_paths = [
  "frontend/comfyui/ui/browser",
  "frontend/comfyui/ui/dialogs",
  "frontend/comfyui/ui/overlays",
  "frontend/comfyui/ui/save",
  "frontend/comfyui/ui/settings",
  "frontend/comfyui/ui/surface",
]
