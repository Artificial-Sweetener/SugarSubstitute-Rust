[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "SugarCubes"
description = "Composable workflow units for ComfyUI."
version = "0.15.3"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Operating System :: OS Independent",
]
dependencies = [
    "aiohttp",
    "av>=16.0.0",
    "certifi>=2025.1.31",
    "pygit2==1.20.1",
    "Pillow>=11.3,<13",
]

[project.urls]
Repository = "https://github.com/Artificial-Sweetener/SugarCubes"
"Bug Tracker" = "https://github.com/Artificial-Sweetener/SugarCubes/issues"

[project.optional-dependencies]
dev = [
    "black",
    "mypy",
    "numpy",
    "Pillow",
    "pytest",
    "ruff==0.15.9",
]

[tool.comfy]
PublisherId = "artificialsweetener"
DisplayName = "SugarCubes"
Icon = ""
includes = []

[tool.setuptools.packages.find]
include = [
    "sugarcubes*",
]

[tool.setuptools.package-data]
sugarcubes = ["py.typed"]
"sugarcubes.model_library.infrastructure" = ["resources/detectors/*.png"]
sugarcubes_model_roots = ["py.typed"]

[tool.black]
target-version = ["py312"]
extend-exclude = '\.pytest_cache/'

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
mypy_path = "stubs"
show_error_codes = true
show_column_numbers = true
warn_unreachable = true
exclude = [
    "^node_modules/",
    "^cubes/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
