name: Record paths proof

# Temporary lane proof: the workspace test run stops at the first failing test binary, so the
# supervision crate's tests never run on Windows while another binary is red. This runs them.
on:
  push:
    branches: [lane/record-paths]

permissions:
  contents: read

defaults:
  run:
    working-directory: Substitute
    shell: pwsh

jobs:
  proof:
    name: Supervision ${{ matrix.code }} (windows-2022)
    strategy:
      fail-fast: false
      matrix:
        code: [fixed, before-fix]
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: 3
      - name: Show the runner's temporary folder spelling
        run: |
          "TEMP=$env:TEMP"
          "TMP=$env:TMP"
          "Resolved=$((Get-Item -LiteralPath $env:TEMP).FullName)"
      - name: Restore the record owner from before the fix
        if: matrix.code == 'before-fix'
        run: |
          git checkout HEAD~2 -- crates/sugarsubstitute-supervision/src/durable_storage/records.rs crates/sugarsubstitute-supervision/src/durable_storage/files/canonical.rs
          git status --short
      - name: Run tests
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $instance = & $vswhere -version '[17.0,18.0)' -products Microsoft.VisualStudio.Product.Enterprise -property installationPath
          Import-Module (Join-Path $instance 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $instance -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64' | Out-Null
          if ('${{ matrix.code }}' -eq 'fixed') {
            cargo test --locked -p sugarsubstitute-supervision --all-features --no-fail-fast
            exit $LASTEXITCODE
          }
          $output = cargo test --locked -p sugarsubstitute-supervision --all-features -- durable_storage::records::tests 2>&1 | Out-String
          $output
          if ($LASTEXITCODE -eq 0) { throw 'The record tests passed without the fix.' }
          if ($output -notmatch 'short_name_parents_open_at_their_resolved_long_location \.\.\. FAILED') { throw 'The short-name test did not fail without the fix.' }
          if ($output -notmatch 'drive_alias_parents_stay_refused_without_creating_records \.\.\. ok') { throw 'The drive-alias test did not pass without the fix.' }
          if ($output -notmatch 'Record parent must use its resolved local location') { throw 'The failure was not the record parent refusal.' }
          'Without the fix, only the short-name test fails, with the record parent refusal.'
