name: Release

# Releases each component from its own commits, and only when dispatched by hand. A run is a
# dry run unless it asks to publish: `authorize` then requires the repository variable
# RELEASES_ENABLED to be exactly "true" and the run to be on main, and fails otherwise. Without
# both, no job here holds write access, so nothing can be tagged, released or uploaded.
#
# `tooling` tests the release tooling, plans which components have a release due, and dry-runs
# each of them in a disposable clone with no credentials; a dry run is that and nothing more.
# When publishing, each due component is verified, then released by semantic-release with its
# own tags (sugarcubes-v<version>, substitute-v<version>), changelog and version files.
# SugarCubes runs first; SugarSubstitute then releases from the updated branch tip, so the two
# release commits never race each other. A SugarSubstitute release then builds the application
# and crash handler in release mode from the released commit, with the update distribution written
# from that version's changelog and the committed release anchor compiled in, signs the release
# manifest with the RELEASE_MANIFEST_KEY secret, assembles and seals the update package with its
# channel descriptor, and the update repository workflow signs them with the release lifetimes.
# Every signing key is a secret of the protected `release` environment, which only these jobs
# use; .github/release/key-ceremony.mjs creates them once, offline. Signing is gated like the
# scheduled re-sign: RELEASES_ENABLED, the committed root and the committed release anchor.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview the releases without publishing anything"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read

concurrency:
  group: release-publication
  cancel-in-progress: false

env:
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.12"
  COMFY_CLI_VERSION: "1.26.0"

jobs:
  authorize:
    name: Decide whether this run may publish
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - name: Decide
        id: decide
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASES_ENABLED: ${{ vars.RELEASES_ENABLED }}
          REF: ${{ github.ref }}
        run: |
          if [ "$DRY_RUN" != "false" ]; then
            echo "Dry run: nothing is published."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$RELEASES_ENABLED" != "true" ]; then
            echo "::error::Publication is switched off: the repository variable RELEASES_ENABLED is not \"true\". Dispatch a dry run instead."
            exit 1
          fi
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Releases publish only from main, not $REF."
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

  tooling:
    name: Release tooling
    needs: authorize
    uses: ./.github/workflows/release-tooling.yml

  sugarcubes:
    name: Release SugarCubes
    needs: [authorize, tooling]
    if: >-
      needs.authorize.outputs.publish == 'true' &&
      (needs.tooling.outputs.sugarcubes_release == 'true' || needs.tooling.outputs.sugarcubes_blocked != '')
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    defaults:
      run:
        working-directory: Sugar
    steps:
      - name: Stop when the release has no baseline
        if: needs.tooling.outputs.sugarcubes_blocked != ''
        env:
          REASON: ${{ needs.tooling.outputs.sugarcubes_blocked }}
        working-directory: .
        run: |
          echo "::error::$REASON"
          exit 1

      - name: Checkout complete history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            Sugar/package-lock.json
            .github/release/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup pinned Rust checks
        run: rustup toolchain install 1.93.1 --profile minimal --component clippy,rustfmt

      - name: Install Node dependencies
        run: npm ci

      - name: Install release tooling
        working-directory: .github/release
        run: npm ci

      - name: Install Python dependencies and the pinned registry client
        run: pip install -e ".[dev]" "comfy-cli==${{ env.COMFY_CLI_VERSION }}"

      - name: Install headless browser runtimes
        run: npx playwright install --with-deps chromium firefox

      - name: Verify repository gate
        run: npm run check

      - name: Verify generated files are committed
        run: git diff --exit-code

      - name: Release
        id: release
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASES_ENABLED: ${{ vars.RELEASES_ENABLED }}
        run: node .github/release/release.mjs release sugarcubes

      - name: Publish the same archive to the Comfy Registry
        if: steps.release.outputs.released == 'true' && vars.RELEASES_ENABLED == 'true'
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          comfy --skip-prompt --no-enable-telemetry env
          python ../.github/release/sugarcubes_registry.py publish \
            --archive "../dist/sugarcubes/SugarCubes-${VERSION}.zip" \
            --changelog-file ../dist/sugarcubes/notes.md

  substitute-verify:
    name: Verify SugarSubstitute
    needs: [authorize, tooling]
    if: >-
      needs.authorize.outputs.publish == 'true' &&
      needs.tooling.outputs.substitute_release == 'true'
    uses: ./.github/workflows/substitute-verify.yml

  substitute:
    name: Release SugarSubstitute
    needs: [authorize, tooling, sugarcubes, substitute-verify]
    if: >-
      always() &&
      needs.authorize.outputs.publish == 'true' &&
      needs.tooling.result == 'success' &&
      (needs.tooling.outputs.substitute_release == 'true' || needs.tooling.outputs.substitute_blocked != '') &&
      (needs.substitute-verify.result == 'success' || needs.tooling.outputs.substitute_blocked != '') &&
      (needs.sugarcubes.result == 'success' || needs.sugarcubes.result == 'skipped')
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Stop when the release has no baseline
        if: needs.tooling.outputs.substitute_blocked != ''
        env:
          REASON: ${{ needs.tooling.outputs.substitute_blocked }}
        run: |
          echo "::error::$REASON"
          exit 1

      - name: Checkout the branch tip, including a SugarCubes release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Require the verified SugarSubstitute sources
        env:
          VERIFIED: ${{ github.sha }}
        run: |
          if ! git diff --quiet "$VERIFIED" HEAD -- Substitute Sugar/integrations/contracts; then
            echo "::error::SugarSubstitute changed after verification; the next run releases it."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: .github/release/package-lock.json

      - name: Install release tooling
        working-directory: .github/release
        run: npm ci

      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASES_ENABLED: ${{ vars.RELEASES_ENABLED }}
        run: node .github/release/release.mjs release substitute

  substitute-update-targets:
    name: Build, sign and package SugarSubstitute's release
    needs: [authorize, substitute]
    if: >-
      always() &&
      needs.authorize.outputs.publish == 'true' &&
      needs.substitute.result == 'success' &&
      needs.substitute.outputs.released == 'true'
    runs-on: windows-2022
    # A hang guard only: a cold release build of the application and crash handler must finish.
    timeout-minutes: 240
    # The release manifest key is an environment secret; only the signing step receives it.
    environment: release
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.substitute.outputs.version }}
      TRUSTED_ROOT: .github/update-repository/root.json
      RELEASE_ANCHOR: Substitute/installer/release/release-anchor.bin
      BUILD_INPUTS_RELEASE: substitute-build-inputs
      WINDOWS_SDK: "10.0.26100.0"
    steps:
      - name: Checkout the released commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.substitute.outputs.tag }}
          persist-credentials: false
          # The provisioning worker is built from the pinned Comfy Desktop sources.
          submodules: true

      - name: Require the trusted root and release anchor installations ship with
        run: |
          for file in "$TRUSTED_ROOT" "$RELEASE_ANCHOR"; do
            if [ ! -f "$file" ]; then
              echo "::error::$file is missing, so no installation could trust this release. Run .github/release/key-ceremony.mjs offline first."
              exit 1
            fi
          done

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: Substitute/installer/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install release build tooling
        working-directory: Substitute/installer
        run: npm ci

      - name: Write the update distribution from this version's changelog
        run: |
          distribution="$RUNNER_TEMP/update-distribution.json"
          node Substitute/installer/release/update-distribution.mjs "$distribution"
          echo "SUGARSUBSTITUTE_UPDATE_DISTRIBUTION=$distribution" >> "$GITHUB_ENV"
          echo "RELEASE_ID=substitute-${VERSION//./_}" >> "$GITHUB_ENV"

      # The crash handler builds from the reviewed, hash-pinned Crashpad source archives and
      # GN/Ninja binaries; every file is checked against its pin before anything is built.
      - name: Download the pinned crash handler build inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          crash="$RUNNER_TEMP/crashpad"
          mkdir -p "$crash/native-build/downloads" "$crash/host-tools"
          gh release download "$BUILD_INPUTS_RELEASE" --repo "$GITHUB_REPOSITORY" \
            --dir "$crash/native-build/downloads" --pattern '*.tar.gz'
          gh release download "$BUILD_INPUTS_RELEASE" --repo "$GITHUB_REPOSITORY" \
            --dir "$crash/host-tools" --pattern 'gn.exe' --pattern 'ninja.exe'
          echo "CRASHPAD_BUNDLE=$crash" >> "$GITHUB_ENV"

      - name: Prepare the repository-pinned Rust
        working-directory: Substitute
        run: rustup show active-toolchain

      - name: Build the application, crash handler and provisioning worker in release mode
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $instance = & $vswhere -version '[17.0,18.0)' -products Microsoft.VisualStudio.Product.Enterprise -property installationPath
          if (-not $instance -or @($instance).Count -ne 1) {
            throw 'Expected one Visual Studio 2022 Enterprise instance on the Windows runner.'
          }
          $version = & $vswhere -version '[17.0,18.0)' -products Microsoft.VisualStudio.Product.Enterprise -property catalog_productDisplayVersion
          $msvc = (Get-Content -LiteralPath (Join-Path $instance 'VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt') -TotalCount 1).Trim()
          $reader = Join-Path $instance 'VC\Tools\Llvm\x64\bin\llvm-readobj.exe'
          if (-not (Test-Path -LiteralPath $reader -PathType Leaf)) { throw "The selected instance has no $reader." }

          # Crash handler: extract and verify the pinned sources, apply the reviewed changes,
          # then build with the selected instance's default toolset and the pinned SDK.
          $crash = $env:CRASHPAD_BUNDLE
          $tools = Join-Path $env:GITHUB_WORKSPACE 'Substitute\tools\crashpad'
          python (Join-Path $tools 'extract_source.py') --bundle-root $crash
          python (Join-Path $tools 'prepare_source.py') --source "$crash\prepared\crashpad" `
            --authored (Join-Path $env:GITHUB_WORKSPACE 'Substitute\native\crashpad') `
            --receipt "$crash\prepare-receipt.json" --downloads "$crash\native-build\downloads"
          python (Join-Path $tools 'build_native.py') --source "$crash\prepared\crashpad" `
            --artifacts "$crash\native-build" --tools "$crash\host-tools" --bundle-root $crash `
            --visual-studio $instance --visual-studio-version $version --msvc $msvc `
            --sdk $env:WINDOWS_SDK --jobs 4

          Import-Module (Join-Path $instance 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $instance -SkipAutomaticLocation -DevCmdArguments "-arch=x64 -host_arch=x64 -winsdk=$env:WINDOWS_SDK" | Out-Null
          $parser = Join-Path $env:GITHUB_WORKSPACE 'Substitute\tools\crashpad\prebuilt\x86_64-pc-windows-msvc'
          $expected = (Get-Content -LiteralPath (Join-Path $parser 'committed_dump_parser.lib.sha256') -TotalCount 1).Split(' ')[0]
          $actual = (Get-FileHash -LiteralPath (Join-Path $parser 'committed_dump_parser.lib') -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "committed_dump_parser.lib is $actual, but its recorded SHA-256 is $expected." }
          $env:SUGAR_COMMITTED_PARSER_LIB = $parser
          $env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER = (Get-Command link.exe).Source
          $env:CARGO_TARGET_DIR = Join-Path $env:RUNNER_TEMP 'target'
          $env:SUGARSUBSTITUTE_RELEASE_ANCHOR = Join-Path $env:GITHUB_WORKSPACE $env:RELEASE_ANCHOR
          $application = Join-Path $env:RUNNER_TEMP 'application'
          node Substitute/installer/release/build-application.mjs $application release windows-x86_64 $reader

          $env:SUBSTITUTE_INSTALLER_BUILD = Join-Path $env:RUNNER_TEMP 'installer'
          node Substitute/installer/build.mjs
          node Substitute/installer/prepare-runtime.mjs

          "APPLICATION_BUILD=$application" >> $env:GITHUB_ENV
          "CRASH_HANDLER_BUILD=$crash\native-build\out-msvc-x64" >> $env:GITHUB_ENV
          "SUBSTITUTE_INSTALLER_BUILD=$env:SUBSTITUTE_INSTALLER_BUILD" >> $env:GITHUB_ENV
          "LLVM_READOBJ=$reader" >> $env:GITHUB_ENV

      - name: Sign the release manifest
        env:
          RELEASE_MANIFEST_KEY: ${{ secrets.RELEASE_MANIFEST_KEY }}
        run: |
          node Substitute/installer/release/sign-release.mjs "$APPLICATION_BUILD" "$CRASH_HANDLER_BUILD" \
            "$GITHUB_WORKSPACE/$RELEASE_ANCHOR" "$RELEASE_ID" "$(python -c 'import sys; print(sys.executable)')" \
            "$RUNNER_TEMP/signed"

      - name: Assemble the release bundle
        run: |
          bundle="$RUNNER_TEMP/bundle"
          node Substitute/installer/package.mjs "$RUNNER_TEMP/signed" "$GITHUB_WORKSPACE/Sugar" "$bundle" \
            "$RELEASE_ID" windows-x86_64 "$LLVM_READOBJ" > "$RUNNER_TEMP/bundle.json"
          echo "RELEASE_BUNDLE=$bundle" >> "$GITHUB_ENV"

      - name: Build the signing tool with the repository-pinned Rust
        working-directory: Substitute
        run: |
          rustup show active-toolchain
          cargo build --locked --release --package sugarsubstitute-update-repository
          echo "TOOL=$PWD/target/release/sugarsubstitute-update-repository.exe" >> "$GITHUB_ENV"

      - name: Seal the update package and describe it in its channel descriptor
        run: |
          sealed="$RUNNER_TEMP/sealed/package.ssupdate"
          mkdir "$RUNNER_TEMP/sealed" "$RUNNER_TEMP/targets"
          node Substitute/installer/seal.mjs --update "$RELEASE_BUNDLE" "$sealed"
          minimum="$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).minimumUpdaterRelease" "$RUNNER_TEMP/bundle.json")"
          "$TOOL" offer --package "$sealed" --version "$VERSION" --channel release \
            --platform windows-x86_64 --component application \
            --minimum-updater-release "$minimum" --output "$RUNNER_TEMP/targets"

      - name: Hand the package and descriptor to the signing workflow
        uses: actions/upload-artifact@v5
        with:
          name: substitute-update-targets
          path: ${{ runner.temp }}/targets/
          if-no-files-found: error
          retention-days: 7

  substitute-update-repository:
    name: Sign SugarSubstitute's release into the update repository
    needs: [authorize, substitute-update-targets]
    if: >-
      always() &&
      needs.authorize.outputs.publish == 'true' &&
      needs.substitute-update-targets.result == 'success'
    permissions:
      contents: write
    uses: ./.github/workflows/substitute-update-repository.yml
    with:
      operation: release
      targets_artifact: substitute-update-targets
    secrets: inherit
