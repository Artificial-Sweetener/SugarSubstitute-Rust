name: Substitute verification

on:
  push:
    paths:
      - 'Substitute/**'
      - 'Sugar/integrations/contracts/**'
      - '.github/workflows/substitute-verify.yml'
      - '!**/*.md'
  pull_request:
    paths:
      - 'Substitute/**'
      - 'Sugar/integrations/contracts/**'
      - '.github/workflows/substitute-verify.yml'
      - '!**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: Substitute

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    # A cold Windows runner spends about eleven minutes in the three Clippy legs alone, before
    # the workspace tests and Rustdoc; the limit only bounds a hung job.
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Governance verifies the vendored Comfy Desktop sources pinned by this submodule.
          submodules: true
      - name: Install Linux windowing libraries
        if: runner.os == 'Linux'
        # tao's Linux backend links GTK 3 and D-Bus through pkg-config; Xvfb hosts the launch check.
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libgtk-3-dev libdbus-1-dev pkg-config xvfb
      - name: Prepare repository-pinned Rust
        run: rustup show active-toolchain
      - name: Verify governance, formatting, lints, tests and Rustdoc
        shell: pwsh
        run: |
          if ($IsWindows) {
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
            $instance = & $vswhere -version '[17.0,18.0)' -products Microsoft.VisualStudio.Product.Enterprise -property installationPath
            if (-not $instance -or @($instance).Count -ne 1) {
              throw 'Expected one Visual Studio 2022 Enterprise instance on the Windows runner.'
            }
            Import-Module (Join-Path $instance 'Common7\Tools\Microsoft.VisualStudio.DevShell.dll')
            Enter-VsDevShell -VsInstallPath $instance -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64' | Out-Null
          }
          cargo xtask verify
          exit $LASTEXITCODE
      - name: Launch the desktop host under Xvfb
        if: runner.os == 'Linux'
        shell: bash
        # The host must present its first frame. Exiting before that fails the step; the job
        # timeout only bounds a hang.
        run: |
          cargo build --locked -p sugarsubstitute --bin sugarsubstitute
          log="$RUNNER_TEMP/desktop-launch.log"
          xvfb-run -a -s '-screen 0 1280x800x24' target/debug/sugarsubstitute >"$log" 2>&1 &
          host=$!
          until grep -q 'operation="native_first_frame"' "$log"; do
            if ! kill -0 "$host" 2>/dev/null; then
              cat "$log"
              echo 'The desktop host exited before presenting its first frame.' >&2
              exit 1
            fi
            sleep 1
          done
          cat "$log"
          kill "$host"
