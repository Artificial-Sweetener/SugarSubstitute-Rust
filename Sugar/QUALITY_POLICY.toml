schema = 1

# Test ownership and subscriptions select areas; checks consume that same selection.
# A check's scripts are independent of one another: the gate runs them side by side.
[[check]]
name = "comfy"
scripts = [
  "check:dependencies",
  "format:check",
  "lint:python",
  "audit:standards",
  "typecheck:frontend",
  "typecheck:tests",
  "typecheck:canvas-tests",
  "typecheck:python",
  "lint",
  "build:check",
]
areas = ["*"]
exclude_areas = ["editor_integrations", "photoshop", "gimp"]

[[check]]
name = "integrations"
scripts = ["check:integrations"]
areas = ["editor_integrations", "photoshop", "gimp"]
exclude_areas = []

[[check]]
name = "gimp"
scripts = ["check:gimp"]
areas = ["gimp", "editor_integrations"]
exclude_areas = []

[[check]]
name = "photoshop"
scripts = ["check:photoshop"]
areas = ["photoshop", "editor_integrations"]
exclude_areas = []
