[package]
name = "sugarcubes-spellcheck"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false
description = "The prompt editor's spellchecker: spellbook compiled to WebAssembly for a Web Worker."

[lib]
crate-type = ["cdylib"]

[dependencies]
spellbook = { version = "=0.4.2", default-features = false }
foldhash = { version = "0.1.5", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
