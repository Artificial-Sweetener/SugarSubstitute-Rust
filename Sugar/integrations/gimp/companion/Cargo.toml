[package]
name = "sugarcubes-gimp-companion"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "AGPL-3.0-or-later"
publish = false

[package.metadata.sugarcubes]
test-runner = ["node", "--import", "tsx", "../../../scripts/gimp/native.ts", "test"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "sugarcubes-gimp-companion"
path = "src/main.rs"
required-features = ["desktop"]

[[test]]
name = "companion_connection"
path = "../../../tests/gimp/contract/companion_connection_test.rs"

[[test]]
name = "native_pipe"
path = "../../../tests/gimp/contract/native_pipe_test.rs"

[[test]]
name = "panel_route"
path = "../../../tests/gimp/contract/panel_route_test.rs"

[[test]]
name = "companion_window"
path = "../../../tests/gimp/contract/companion_window_test.rs"

[features]
default = []
desktop = ["dep:tauri", "dep:tauri-build", "dep:tracing", "dep:tracing-subscriber", "dep:windows"]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
url = "=2.5.8"

[target.'cfg(windows)'.dependencies]
tauri = { version = "=2.12.5", features = ["unstable"], optional = true }
tracing = { version = "=0.1.41", optional = true }
tracing-subscriber = { version = "=0.3.20", default-features = false, features = ["fmt"], optional = true }
windows = { version = "=0.62.2", features = ["Win32_Foundation"], optional = true }

[target.'cfg(windows)'.build-dependencies]
tauri-build = { version = "=2.7.4", optional = true }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
