<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="panel.css" />
    <script src="main.js" defer></script>
  </head>
  <body>
    <div id="panel">
      <webview id="comfyui" width="100%" height="100%"></webview>
      <div id="connection" role="status" aria-live="polite">

        <p id="connection-message">Connecting to ComfyUI.</p>
        <button id="retry" type="button">Retry connection</button>
      </div>
    </div>
  </body>
</html>
