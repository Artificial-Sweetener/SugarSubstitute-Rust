schema_version = 1
platforms = ["windows", "macos", "linux"]

[[owners]]
package = "sugarsubstitute-contracts"
root = "crates/sugarsubstitute-contracts"
concern = "Owned contracts, localization, memory claims, immutable frames and scoped lifecycle facts"
minimum_tests = 43

[[owners]]
package = "sugarsubstitute-application"
root = "crates/sugarsubstitute-application"
concern = "Acknowledged startup, settled retry, frame publication, backend leases, desktop exit and UI challenge policy"
minimum_tests = 45

[[owners]]
package = "sugarsubstitute-comfy"
root = "crates/sugarsubstitute-comfy"
concern = "Bounded startup schema and explicit launch or loopback attachment admission"
minimum_tests = 6

[[owners]]
package = "sugarsubstitute"
root = "crates/sugarsubstitute"
concern = "Product identity, native input, admitted preparation, process qualification and actual host shutdown"
minimum_tests = 34

[[owners]]
package = "sugarsubstitute-execution"
root = "crates/sugarsubstitute-execution"
concern = "Admission, CPU scheduling, cancellation, retained ownership and observed worker teardown"
minimum_tests = 86

[[owners]]
package = "sugarsubstitute-xtask"
root = "tools/xtask"
concern = "Governance rejection behavior and verification orchestration"
minimum_tests = 1

[[owners]]
package = "sugarsubstitute-supervision"
root = "crates/sugarsubstitute-supervision"
concern = "Exact Windows launch inputs, retained containment, actual typed exits and cleanup failures"
minimum_tests = 61

[[owners]]
package = "sugarsubstitute-splash"
root = "crates/sugarsubstitute-splash"
concern = "Character animation, bounded admitted raster and glyph preparation with immutable output"
minimum_tests = 65

[[owners]]
package = "sugarsubstitute-desktop"
root = "crates/sugarsubstitute-desktop"
concern = "Nonblocking frame delivery, headless settlement, retained native storage, input and timing boundaries"
minimum_tests = 80
