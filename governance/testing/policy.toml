path = "crates/sugarsubstitute/src/paused_clock.rs"
source_sha256 = "sha256:c8091a496cb5567b481f4345e9de5b3d67152ec1c83c6bcb08b595da50fb2428"
reason = "Product services poll on their injected clock; this test clock freezes logical time and lets only polling delays of at most one second elapse for real, so no deadline can expire from machine load."

