schema_version = 1
soft_lines = 350
hard_lines = 500
source_roots = ["crates", "tools"]

# Layers run from pure contracts to composition. A lower layer cannot depend
# on a higher layer; repository tooling is not a runtime dependency.
layers = ["domain", "application", "adapter", "host", "tooling"]

[[owners]]
package = "sugarsubstitute-contracts"
root = "crates/sugarsubstitute-contracts"
layer = "domain"
concern = "Runtime-independent application contracts and product localization"

[[owners]]
package = "sugarsubstitute-application"
root = "crates/sugarsubstitute-application"
layer = "application"
concern = "Acknowledged startup, settled retry, readiness, frame publication and supervision policy"

[[owners]]
package = "sugarsubstitute-comfy"
root = "crates/sugarsubstitute-comfy"
layer = "adapter"
concern = "ComfyUI startup configuration and connection boundaries"

[[owners]]
package = "sugarsubstitute"
root = "crates/sugarsubstitute"
auxiliary_roots = ["installer/worker", "installer/surface"]
layer = "host"
concern = "Platform-independent startup and conflict controllers, retained native adapter contracts, platform host composition and application identity"

[[owners]]
package = "sugarsubstitute-execution"
root = "crates/sugarsubstitute-execution"
layer = "adapter"
concern = "Application execution and task lifetime"

[[owners]]
package = "sugarsubstitute-xtask"
root = "tools/xtask"
auxiliary_roots = ["installer/release"]
layer = "tooling"
concern = "Repository governance and verification"

[[owners]]
package = "sugarsubstitute-supervision"
root = "crates/sugarsubstitute-supervision"
layer = "adapter"
concern = "Windows process and claim custody, protected native installation/update storage, authenticated update preparation and create-only native preview artifacts"

[[owners]]
package = "sugarsubstitute-splash"
root = "crates/sugarsubstitute-splash"
layer = "adapter"
concern = "CPU splash appearance, animation and portable presentation state"

[[owners]]
package = "sugarsubstitute-desktop"
root = "crates/sugarsubstitute-desktop"
layer = "adapter"
concern = "Native window, headless event loop and CPU surface lifetime"

[[owners]]
package = "sugarsubstitute-crash"
root = "crates/sugarsubstitute-crash"
layer = "adapter"
concern = "Retained Windows capture, exact physical origin opening, native retirement, bounded symbol/report effects and restart-safe historical capture publication"

[[owners]]
package = "sugarsubstitute-update"
root = "crates/sugarsubstitute-update"
layer = "adapter"
concern = "Portable distribution inventory, update metadata authentication, HTTP destination/framing policy and streaming target verification"
