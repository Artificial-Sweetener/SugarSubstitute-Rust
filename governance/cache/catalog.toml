source_sha256 = "sha256:8ff08834b4dc10c8a65179ecffbc57e972fa2084c17cc06680a37a1c2998ccc7"
namespace = "runtime-cache-v1"
storage_schema = 1
compatibility_epoch = 1
compatibility_inputs = ["cache_scope_owner_marker", "entry_record_schema", "feature_namespace_epoch", "feature_semantic_key", "native_generation_identity", "feature_owned_native_recovery_descriptor"]
freshness = "Feature owners authenticate cache content. Shared storage tracks UTC last use and independent replacement generations; native read pins exclude mutation and cleanup."
retention = "Each explicit cache scope admits at most 64 GiB of payload ceilings and enforces namespace limits of 64 MiB for offers, 24 GiB for each download namespace, 32 GiB for extracted payloads, 1 GiB for setup browser data and 256 MiB for upstream metadata. Idle retention is seven days for offers, payloads and metadata, thirty days for downloads and one day for setup browser data. Active native leases and durable unfinished producer grants win over pressure. Bounded control metadata remains separate from payload accounting."
recovery = "Damaged entry records are observable misses. New independent generations preserve their bytes. Feature owners recover unfinished native producers before finalizing their inventories. Cleanup validates exact inventories, journals intent, compares native identities and resumes after interruption; unknown files and authoritative siblings remain intact. Admission conservatively accounts for preserved content."
