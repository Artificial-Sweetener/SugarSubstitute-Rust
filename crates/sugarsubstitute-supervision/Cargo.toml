[package]
name = "sugarsubstitute-supervision"
description = "Native supervision launch preparation and process ownership boundaries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[features]
boundary-fixtures = ["sugarsubstitute-networking/boundary-fixtures"]
local-k1-symbol-trust = []
# Proof builds only: a headless proof names an owned stand-in for the account's earlier profile
# folder, so it never reads or changes the account's own data. Never part of a shipped build.
qualification-historical-root = []
k1-native-qualification = ["sugarsubstitute-execution/k1-native-qualification"]
local-update-qualification = ["sugarsubstitute-update/boundary-fixtures"]

[dependencies]
sugarsubstitute-contracts = { path = "../sugarsubstitute-contracts" }
sugarsubstitute-configuration = { path = "../sugarsubstitute-configuration" }
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
sugarsubstitute-networking = { path = "../sugarsubstitute-networking" }
sugarsubstitute-execution = { path = "../sugarsubstitute-execution" }
sugarsubstitute-update = { path = "../sugarsubstitute-update" }
sha2.workspace = true
ring.workspace = true
flate2.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
windows = { workspace = true, features = ["Win32_System_Console", "Win32_System_RestartManager", "Win32_System_Diagnostics_ToolHelp", "Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_System_IO", "Win32_Globalization", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_UI_Shell"] }

[dev-dependencies]
sugarsubstitute-execution = { path = "../sugarsubstitute-execution", features = ["boundary-fixtures"] }
tempfile.workspace = true

[target.'cfg(windows)'.dev-dependencies]
sugarsubstitute-networking = { path = "../sugarsubstitute-networking", features = ["boundary-fixtures"] }
sugarsubstitute-update = { path = "../sugarsubstitute-update", features = ["boundary-fixtures"] }

[lints]
workspace = true
