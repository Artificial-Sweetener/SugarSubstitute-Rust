[package]
name = "sugarsubstitute-desktop"
description = "Native desktop window lifetime and CPU surface presentation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = []
boundary-fixtures = []
k1-native-qualification = []

[dependencies]
sugarsubstitute-ui = { path = "../sugarsubstitute-ui" }
sugarsubstitute-contracts = { path = "../sugarsubstitute-contracts" }
sugarsubstitute-canvas = { path = "../sugarsubstitute-canvas" }
sugarsubstitute-image-ops = { path = "../sugarsubstitute-image-ops" }
sugarsubstitute-image-gpu = { path = "../sugarsubstitute-image-gpu" }
tao.workspace = true
tracing.workspace = true
url.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Win32_Devices_Display", "Win32_Security", "Win32_System_StationsAndDesktops", "Win32_UI_Controls_RichEdit", "Win32_UI_Accessibility", "Win32_System_LibraryLoader", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Imaging", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Input_Ime", "Win32_System_Registry", "Win32_System_SystemInformation"] }
windows-core.workspace = true
windows-numerics.workspace = true
wry.workspace = true
webview2-com.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
softbuffer.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
gtk.workspace = true
cairo-rs.workspace = true

[dev-dependencies]
sugarsubstitute-application = { path = "../sugarsubstitute-application" }
sugarsubstitute-execution = { path = "../sugarsubstitute-execution" }

[lints]
workspace = true
