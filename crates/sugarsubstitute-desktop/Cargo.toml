[package]
name = "sugarsubstitute-desktop"
description = "Native desktop window lifetime and CPU surface presentation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[features]
k1-native-qualification = []

[dependencies]
sugarsubstitute-contracts = { path = "../sugarsubstitute-contracts" }
tao.workspace = true
tracing.workspace = true
url.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Win32_Security", "Win32_System_StationsAndDesktops"] }
windows-core.workspace = true
wry.workspace = true
webview2-com.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
softbuffer.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
gtk.workspace = true
cairo-rs.workspace = true

[dev-dependencies]
sugarsubstitute-application = { path = "../sugarsubstitute-application" }
sugarsubstitute-execution = { path = "../sugarsubstitute-execution" }

[lints]
workspace = true
