[package]
name = "sugarsubstitute"
description = "SugarSubstitute Rust desktop host foundation for ComfyUI and SugarCubes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
default-run = "sugarsubstitute"

[features]
default = ["windows-native-host"]
windows-native-host = []
k1-native-qualification = ["sugarsubstitute-execution/k1-native-qualification", "sugarsubstitute-desktop/k1-native-qualification", "sugarsubstitute-supervision/k1-native-qualification"]
native-composition = ["sugarsubstitute-desktop/native-composition"]
composition-qualification = ["k1-native-qualification", "native-composition", "sugarsubstitute-desktop/composition-qualification"]

[dependencies]
sugarsubstitute-ui = { path = "../sugarsubstitute-ui" }
sugarsubstitute-contracts = { path = "../sugarsubstitute-contracts" }
sugarsubstitute-configuration = { path = "../sugarsubstitute-configuration" }
sugarsubstitute-application = { path = "../sugarsubstitute-application" }
sugarsubstitute-comfy = { path = "../sugarsubstitute-comfy" }
sugarsubstitute-execution = { path = "../sugarsubstitute-execution" }
sugarsubstitute-splash = { path = "../sugarsubstitute-splash" }
sugarsubstitute-desktop = { path = "../sugarsubstitute-desktop" }
sugarsubstitute-supervision = { path = "../sugarsubstitute-supervision" }
sugarsubstitute-image-ops = { path = "../sugarsubstitute-image-ops" }
sugarsubstitute-canvas = { path = "../sugarsubstitute-canvas" }
sugarsubstitute-canvas-render = { path = "../sugarsubstitute-canvas-render" }
sugarsubstitute-image-io = { path = "../sugarsubstitute-image-io" }
sugarsubstitute-image-gpu = { path = "../sugarsubstitute-image-gpu" }
png.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
sugarsubstitute-networking = { path = "../sugarsubstitute-networking" }
sugarsubstitute-crash = { path = "../sugarsubstitute-crash" }

[target.'cfg(windows)'.dev-dependencies]
tempfile.workspace = true
sugarsubstitute-execution = { path = "../sugarsubstitute-execution", features = ["boundary-fixtures"] }
sugarsubstitute-desktop = { path = "../sugarsubstitute-desktop", features = ["boundary-fixtures"] }
sugarsubstitute-supervision = { path = "../sugarsubstitute-supervision", features = ["boundary-fixtures"] }

[build-dependencies]
sugarsubstitute-contracts = { path = "../sugarsubstitute-contracts" }
sugarsubstitute-update = { path = "../sugarsubstitute-update" }

[lints]
workspace = true
