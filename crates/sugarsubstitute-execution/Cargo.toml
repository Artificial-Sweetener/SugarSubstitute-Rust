[package]
name = "sugarsubstitute-execution"
description = "Bounded application execution and owned task lifetimes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = []
boundary-fixtures = []
k1-native-qualification = []

[dependencies]
sugarsubstitute-contracts = { path = "../sugarsubstitute-contracts" }
tokio.workspace = true
tracing.workspace = true
serde_json.workspace = true
serde.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_System_Diagnostics_Debug", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Pipes", "Win32_System_IO", "Wdk_Storage_FileSystem", "Win32_System_Memory", "Win32_System_SystemServices", "Win32_System_Environment", "Win32_System_SystemInformation", "Win32_System_WindowsProgramming", "Win32_Storage_FileSystem"] }

[lints]
workspace = true
