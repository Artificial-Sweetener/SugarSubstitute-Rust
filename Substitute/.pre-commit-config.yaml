repos:
  - repo: local
    hooks:
      - id: whitespace-integrity
        name: Check staged whitespace integrity
        entry: git diff --cached --check
        language: system
        pass_filenames: false
        always_run: true
      - id: sugarsubstitute-check
        name: Check SugarSubstitute governance, formatting and lints
        entry: cargo xtask check
        language: system
        pass_filenames: false
        exclude: '\.md$'
