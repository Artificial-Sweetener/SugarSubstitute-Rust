[package]
name = "sugarsubstitute-ui"
description = "Shared native UI rendering and widget behavior"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
tiny-skia.workspace = true
resvg.workspace = true
sugarsubstitute-contracts = { path = "../sugarsubstitute-contracts" }

[target.'cfg(not(target_os = "windows"))'.dependencies]
cosmic-text.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_UI_Controls_RichEdit"] }

windows-core.workspace = true

[dev-dependencies]
cosmic-text.workspace = true

[lints]
workspace = true
