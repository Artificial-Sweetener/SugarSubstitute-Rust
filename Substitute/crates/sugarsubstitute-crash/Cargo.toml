[package]
name = "sugarsubstitute-crash"
description = "Retained Windows native crash capture ownership"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
sugarsubstitute-supervision = { path = "../sugarsubstitute-supervision" }
sugarsubstitute-contracts = { path = "../sugarsubstitute-contracts" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
sugarsubstitute-execution = { path = "../sugarsubstitute-execution" }
tracing.workspace = true
windows = { workspace = true, features = ["Win32_Storage_FileSystem", "Win32_System_LibraryLoader", "Win32_System_IO", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Diagnostics_Debug", "Win32_Security"] }

[lints]
workspace = true

[target.'cfg(windows)'.dev-dependencies]
sugarsubstitute-execution = { path = "../sugarsubstitute-execution", features = ["boundary-fixtures"] }
sugarsubstitute-supervision = { path = "../sugarsubstitute-supervision", features = ["boundary-fixtures"] }
sugarsubstitute-application = { path = "../sugarsubstitute-application" }
