schema_version = 1

# Substitute compiles and tests against the SugarCubes host contract directly from its single
# source in the pack. These are the exact contract files it consumes and the authored files
# allowed to reference them.
[[components]]
id = "sugarcubes-contracts"
root = "Sugar/integrations/contracts"
owner = "SugarCubes integrations/contracts: portable editor schemas, generated bindings and shared wire vectors"
files = [
