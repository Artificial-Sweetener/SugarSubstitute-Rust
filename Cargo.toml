[workspace]
members = ["crates/sugarsubstitute-networking", "crates/sugarsubstitute", "crates/sugarsubstitute-contracts", "crates/sugarsubstitute-application", "crates/sugarsubstitute-comfy", "crates/sugarsubstitute-execution", "crates/sugarsubstitute-supervision", "crates/sugarsubstitute-splash", "crates/sugarsubstitute-ui", "crates/sugarsubstitute-desktop", "crates/sugarsubstitute-crash", "crates/sugarsubstitute-update", "tools/xtask", "crates/sugarsubstitute-configuration", "crates/sugarsubstitute-image-ops", "crates/sugarsubstitute-canvas", "crates/sugarsubstitute-canvas-render", "crates/sugarsubstitute-image-io", "crates/sugarsubstitute-image-gpu"]
exclude = ["third_party/wry"]

default-members = ["crates/sugarsubstitute-networking", "crates/sugarsubstitute"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93.1"
license = "GPL-3.0-or-later"
authors = ["Artificial Sweetener and contributors"]
publish = false

[workspace.dependencies]
libc = "=0.2.190"
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
url = "=2.5.8"
sha2 = "=0.10.9"
ring = "=0.17.14"
tuf = { version = "=0.3.0-beta14", default-features = false }
chrono = { version = "=0.4.42", default-features = false, features = ["std"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
syn = { version = "=2.0.114", features = ["full", "visit"] }
tempfile = "=3.24.0"
time = { version = "=0.3.45", features = ["parsing", "formatting"] }
toml = "=0.8.23"
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "sync", "time", "macros", "net"] }
tiny-skia = "=0.12.0"
resvg = { version = "=0.48.1", default-features = false }
png = "=0.18.1"
zune-jpeg = { version = "=0.5.15", default-features = false, features = ["std"] }
zune-core = { version = "=0.5.3", default-features = false, features = ["std"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "vulkan", "metal", "wgsl"] }
cosmic-text = { version = "=0.19.0", default-features = false, features = ["std", "swash"] }
tao = "=0.37.0"
softbuffer = { version = "=0.4.8", default-features = false }
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Media", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Graphics_DirectWrite", "Win32_System_Performance", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Controls_Dialogs", "Win32_System_Memory", "Win32_System_DataExchange", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
windows-core = "=0.62.2"
windows-numerics = "=0.3.1"
wry = { version = "=0.57.0", default-features = false, features = ["tracing"] }
webview2-com = "=0.39.0"
gtk = "=0.18.2"
cairo-rs = "=0.18.5"
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.20", default-features = false, features = ["fmt", "env-filter"] }

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "deny"
unreachable_pub = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
missing_safety_doc = "deny"
panic = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
debug = "line-tables-only"
lto = "thin"

[patch.crates-io]
wry = { path = "third_party/wry" }
