<html lang="__LOCALE__">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'">
  <title>__TITLE__</title>
  <style>__STYLE__</style>
</head>
<body>
  <header id="brand">
    <div class="wordmark" aria-label="SugarSubstitute">__WORDMARK__</div>
    <div class="journey"><span id="step"></span><progress id="journey" max="7" value="1"></progress></div>
    <button id="close" class="caption" data-label="close"><span aria-hidden="true">__ICON_CLOSE__</span></button>
  </header>
  <div class="body">
    <main id="pages">
      <section id="language" class="page language-page">
        <div class="hero"><div class="hero-icon" aria-hidden="true">__ICON_LANGUAGE__</div><div><h1 data-text="languageTitle"></h1><p data-text="languageDescription"></p></div></div>
        <div class="select-control language-select"><select id="locale" data-label="languageTitle"></select><span aria-hidden="true">__ICON_CHEVRON__</span></div>
      </section>
      <section id="location" class="page location-page" hidden>
        <div class="hero"><div class="hero-icon" aria-hidden="true">__ICON_FOLDER__</div><div><h1 data-text="locationTitle"></h1><p data-text="locationDescription"></p></div></div>
        <div class="field-block"><label for="installRoot" data-text="installFolder"></label><div class="field"><input id="installRoot" autocomplete="off" spellcheck="false"><button data-browse="installRoot" data-text="browse"></button></div></div>
      </section>
      <section id="runtime" class="page" hidden>
        <div class="hero"><div><h1 id="runtimeTitle" data-text="runtimeTitle"></h1></div></div>
        <div class="section choices" role="radiogroup" aria-labelledby="runtimeTitle">
          <label class="choice"><span class="choice-heading"><span class="choice-icon" aria-hidden="true">__ICON_HOME__</span><span><strong data-text="managedTitle"></strong><small data-text="managedDescription"></small></span></span><span class="choice-selection"><input type="radio" name="mode" value="managed" checked><span data-choice-label="managed"></span></span></label>
          <label class="choice"><span class="choice-heading"><span class="choice-icon" aria-hidden="true">__ICON_LINK__</span><span><strong data-text="attachedTitle"></strong><small data-text="attachedDescription"></small></span></span><span class="choice-selection"><input type="radio" name="mode" value="attached"><span data-choice-label="attached"></span></span></label>
        </div>
      </section>
      <section id="configuration" class="page configuration-page" hidden>
        <div class="hero"><div class="hero-icon" aria-hidden="true"><span id="managedIcon">__ICON_HOME__</span><span id="attachedIcon" hidden>__ICON_LINK__</span></div><div><h1 id="configurationTitle"></h1><p id="configurationDescription"></p></div></div>
        <div class="section">
          <div id="managed">
            <div class="columns">
              <div class="field-block"><label for="release" data-text="channel"></label><div class="select-control"><select id="release"></select><span aria-hidden="true">__ICON_CHEVRON__</span></div></div>
              <div class="field-block"><label for="comfyVersion" data-text="version"></label><div class="select-control"><select id="comfyVersion"></select><span aria-hidden="true">__ICON_CHEVRON__</span></div></div>
            </div>
            <div class="field-block"><label for="variant" data-text="hardware"></label><div class="select-control"><select id="variant"></select><span aria-hidden="true">__ICON_CHEVRON__</span></div></div>
            <p id="variantDetail" class="helper"></p>
            <label class="check"><input id="mirrors" type="checkbox"><span data-text="mirrors"></span></label>
          </div>
          <div id="attached" hidden>
            <div class="field-block"><label for="comfyRoot" data-text="comfyFolder"></label><div class="field"><input id="comfyRoot" autocomplete="off" spellcheck="false"><button data-browse="comfyRoot" data-text="browse"></button></div></div>
            <div class="field-block"><label for="python" data-text="python"></label><div class="field"><input id="python" autocomplete="off" spellcheck="false"><button data-browse="python" data-text="browse"></button></div><p class="helper" data-text="pythonHelp"></p></div>
          </div>
        </div>
      </section>
      <section id="folders" class="page folders-page" hidden>
        <div class="hero compact-hero"><div class="hero-icon" aria-hidden="true">__ICON_FOLDER__</div><div><h1 data-text="foldersTitle"></h1></div></div>
        <div class="section">
          <div class="field-block"><label for="models" data-text="models"></label><div class="field"><input id="models" autocomplete="off" spellcheck="false"><button data-browse="models" data-text="browse"></button></div></div>
          <div class="field-block"><label for="outputs" data-text="outputs"></label><div class="field"><input id="outputs" autocomplete="off" spellcheck="false"><button data-browse="outputs" data-text="browse"></button></div></div>
          <p class="helper" data-text="preservation"></p>
        </div>
      </section>
      <section id="maintenance" class="page" hidden>
        <div class="hero"><div class="hero-icon" aria-hidden="true">__ICON_SYNC__</div><div><h1 data-text="maintenanceTitle"></h1><p id="maintenanceNotice"></p></div></div>
        <dl class="section completion-panel"><dt data-text="installFolder"></dt><dd id="maintenancePath"></dd><dt data-text="comfyFolder"></dt><dd id="maintenanceComfy"></dd></dl>
      </section>
      <section id="progress" class="page" hidden>
        <div class="hero"><div class="hero-icon" aria-hidden="true">__ICON_SYNC__</div><div><h1 data-text="progressTitle"></h1><p data-text="progressDescription"></p></div></div>
        <div class="section progress-panel">
          <p id="status" role="status" aria-live="polite"></p>
          <progress id="total" max="100" value="0"></progress>
          <details id="details"><summary data-text="details"></summary><div id="console" aria-hidden="true"></div></details>
        </div>
      </section>
      <section id="complete" class="page completion-page" hidden>
        <div class="hero compact-hero"><div class="hero-icon" aria-hidden="true">__ICON_ACCEPT__</div><div><h1 data-text="completeTitle"></h1></div></div>
        <dl class="section completion-panel"><dt data-text="installFolder"></dt><dd id="installedPath"></dd></dl>
      </section>
    </main>
    <p id="wait" class="helper" role="status" hidden data-text="longWait"></p>
    <p id="error" role="alert" hidden></p>
    <footer><button id="back" data-text="back" hidden></button><button id="primary" class="primary" data-text="continue"></button></footer>
  </div>
  <script>
    window.setupBootstrap = __BOOTSTRAP__;
    if (window.chrome?.webview) {
      window.ipc = { postMessage: message => window.chrome.webview.postMessage(message) };
      window.chrome.webview.addEventListener('message', event => window.setupReceive?.(event.data));
    }
  </script>
  <script>__SCRIPT__</script>
</body>
</html>
